name: Jar yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven bilan yig'ish
        run: mvn -B clean package

      - name: Jar faylni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ShoxCraftYangiYil
          path: target/ShoxCraftYangiYil.jar
